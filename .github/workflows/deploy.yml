# Publica el sitio en GitHub Pages en cada push a main.
# El sitio es un proyecto de Vite: hay que compilarlo (npm run build) y publicar
# la carpeta dist/, no el código fuente. En Settings → Pages, el origen debe ser
# "GitHub Actions" y el dominio personalizado se configura ahí (www.kinchika.cl).
# El repo es de la organización kinchika: para repos públicos, Actions y Pages son gratis.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# una publicación a la vez; no cancelar una que ya está en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
