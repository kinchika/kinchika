# DESACTIVADO (solo se ejecuta a mano): la cuenta no tiene GitHub Actions disponible
# por un bloqueo de facturación, y no se paga nada por el sitio.
# Hoy el sitio se publica compilando (npm run build) y subiendo dist/ a la rama
# gh-pages; en Settings → Pages el origen es "Deploy from a branch" → gh-pages.
# Si algún día Actions vuelve a funcionar, se puede reactivar agregando el
# disparo "push: branches: [main]" y cambiando el origen a "GitHub Actions".
name: Publicar en GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# una publicación a la vez; no cancelar una que ya está en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
